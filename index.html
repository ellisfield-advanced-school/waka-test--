<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>和花・英語テスト</title>
   <style>
       body {
           font-family: 'Helvetica Neue', Arial, sans-serif;
           background-color: #f0f4f8;
           margin: 0;
           padding: 20px;
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
       }
       .quiz-container {
           background-color: white;
           border-radius: 12px;
           box-shadow: 0 4px 10px rgba(0,0,0,0.1);
           padding: 30px;
           width: 100%;
           max-width: 450px;
           text-align: center;
           box-sizing: border-box;
       }
       h1 { font-size: 20px; color: #333; margin-top: 0; }
       .japanese { font-size: 20px; font-weight: bold; color: #333; margin: 15px 0; word-break: break-all; text-align: left; }
       .question-text { font-size: 20px; color: #444; margin-bottom: 15px; text-align: left; line-height: 1.5; }
       .progress { color: #666; font-size: 14px; margin-bottom: 15px; }
       .btn {
           background-color: white;
           color: #333;
           border: 2px solid #e0e0e0;
           padding: 14px;
           font-size: 16px;
           border-radius: 8px;
           cursor: pointer;
           width: 100%;
           margin-bottom: 12px;
           font-weight: bold;
           text-align: center;
           box-sizing: border-box;
           transition: background-color 0.2s;
       }
       .btn:hover { background-color: #f7f9fa; }
       .choice-btn { font-size: 18px; letter-spacing: 0.5px; }
       .action-btn {
           background-color: #4a90e2;
           color: white;
           border: none;
           padding: 12px;
           font-size: 16px;
           border-radius: 6px;
           width: 100%;
           font-weight: bold;
           margin-top: 10px;
           cursor: pointer;
       }
       .result-message { font-size: 20px; font-weight: bold; margin: 15px 0; text-align: left; line-height: 1.5; }
       .correct { color: #2ecc71; border-color: #2ecc71 !important; background-color: #eafeec; }
       .incorrect { color: #e74c3c; border-color: #e74c3c !important; background-color: #fdedec; }

       /* --- 語句整序（並べ替え）用スタイル --- */
       .word-pool, .answer-zone {
           display: flex;
           flex-wrap: wrap;
           gap: 8px;
           min-height: 45px;
           padding: 10px;
           border-radius: 8px;
           margin-bottom: 12px;
       }
       .word-pool { background-color: #f8f9fa; border: 1px dashed #ccc; }
       .answer-zone { background-color: #eef5fc; border: 2px solid #4a90e2; }
       .word-chip {
           background-color: white;
           border: 1px solid #4a90e2;
           color: #4a90e2;
           padding: 6px 12px;
           border-radius: 20px;
           font-weight: bold;
           cursor: pointer;
           user-select: none;
       }
       .word-chip.selected { opacity: 0.3; pointer-events: none; }
   </style>
</head>
<body>

<div class="quiz-container">
   <div id="category-screen">
       <div style="font-size: 16px; color: #555; font-weight: bold; margin-bottom: 5px; text-align: center;">エリスフィールド進学会</div>
       <h1>テストするカテゴリを選んでね</h1>
       <div id="category-list"></div>
   </div>

   <div id="quiz-screen" style="display: none;">
       <div class="progress" id="progress">第 1 問 / 全 10 問</div>
       <div class="japanese" id="japanese-word"></div>
       <div class="question-text" id="question-text" style="display:none;"></div>

       <button onclick="speakWord()" id="speak-btn" class="btn"
           style="margin-bottom:20px;max-width:200px;margin-left:auto;margin-right:auto;padding:10px;font-size:16px;">
           🔊 発音を聞く
       </button>

       <!-- 4択問題用 -->
       <div id="choices-list"></div>

       <!-- 語句整序用 -->
       <div id="sort-container" style="display:none;">
           <div class="answer-zone" id="answer-zone"></div>
           <div class="word-pool" id="word-pool"></div>
           <button onclick="clearSortAnswer()" class="btn" style="padding:6px; font-size:14px; margin-bottom:10px;">やり直す</button>
           <button onclick="checkSortAnswer()" id="sort-submit-btn" class="action-btn">回答する</button>
       </div>

       <div class="result-message" id="result-message"></div>

       <button onclick="nextQuestion()" id="next-btn" class="action-btn" style="display:none;">
           次へ進む
       </button>
   </div>

   <div id="result-screen" style="display: none;">
       <h2>テスト終了！</h2>
       <p id="final-score" style="font-size: 18px; font-weight: bold;"></p>
       <button onclick="showCategoryScreen()" class="action-btn">

</div>

let currentCategory = ""; 
let currentQuestions = []; 
let currentIndex = 0; 
let score = 0; 
let isAnswered = false;
let isWordQuizMode = true;
let selectedWords = [];

function showCategoryScreen() {
   document.getElementById("category-screen").style.display = "block";
   document.getElementById("quiz-screen").style.display = "none"; 
   document.getElementById("result-screen").style.display = "none";
   
   const catListDiv = document.getElementById("category-list");
   catListDiv.innerHTML = "";
   
   // 単語テストカテゴリの整理
   const specialCats = ["不規則動詞 (過去形)", "不規則動詞 (過去分詞)", "形容詞・副詞 (比較級)", "形容詞・副詞 (最上級)"];
   const wordCats = Object.keys(wordData);
   const sortedWordCats = wordCats.filter(cat => !specialCats.includes(cat));
   specialCats.forEach(cat => { if (wordCats.includes(cat)) sortedWordCats.push(cat); });

   // 「論理表現」などの文章問題を先頭（一番上）に配置
   const allCategories = [...Object.keys(quizData), ...sortedWordCats];

   allCategories.forEach(category => {
       const btn = document.createElement("button"); 
       btn.className = "btn"; 
       btn.innerText = category; 
       btn.onclick = () => startQuiz(category); 
       catListDiv.appendChild(btn);
   });
}

function startQuiz(category) {
   currentCategory = category; 
   currentIndex = 0; 
   score = 0;
if (quizData[category]) {
    // 語句整序・文章問題モード
    isWordQuizMode = false;
    currentQuestions = quizData[category].map(q => ({
        ...q,
        words: q.words ? [...q.words].sort(() => Math.random() - 0.5) : q.words
    }));
}
 else {
       // 英単語テストモード
       isWordQuizMode = true;
       currentQuestions = [...wordData[category]].sort(() => Math.random() - 0.5);
       if (currentQuestions.length > 10) { currentQuestions = currentQuestions.slice(0, 10); }
   }

   document.getElementById("category-screen").style.display = "none";
   document.getElementById("quiz-screen").style.display = "block"; 
   showQuestion();
}

function showQuestion() {
   isAnswered = false;
   document.getElementById("next-btn").style.display = "none";
   document.getElementById("result-message").innerText = "";
   document.getElementById("progress").innerText = `第 ${currentIndex + 1} 問 / 全 ${currentQuestions.length} 問`; 

   if (isWordQuizMode) {
       // --- 単語テスト画面 ---
       document.getElementById("speak-btn").style.display = "block";
       document.getElementById("question-text").style.display = "none";
       document.getElementById("sort-container").style.display = "none";
       document.getElementById("choices-list").style.display = "block";

       const currentQuestion = currentQuestions[currentIndex];
       document.getElementById("japanese-word").innerHTML = currentQuestion.japanese;
       
       const choices = makeChoices(currentQuestion.english, wordData[currentCategory]); 
       const choicesListDiv = document.getElementById("choices-list"); 
       choicesListDiv.innerHTML = "";
       
       choices.forEach(choice => {
           const btn = document.createElement("button"); 
           btn.className = "btn choice-btn"; 
           btn.innerText = choice; 
           btn.onclick = () => checkWordAnswer(btn, choice, currentQuestion.english); 
           choicesListDiv.appendChild(btn);
       });
   } else {
       // --- 語句整序・文章テスト画面 ---
       document.getElementById("speak-btn").style.display = "block";
       document.getElementById("japanese-word").innerHTML = "";
       
       const q = currentQuestions[currentIndex];
       const qText = document.getElementById("question-text");
       qText.style.display = "block";
       qText.innerHTML = q.question;

       selectedWords = [];

       if (q.type === "sort") {
           document.getElementById("choices-list").style.display = "none";
           document.getElementById("sort-container").style.display = "block";
           renderSortUI();
       } else {
           document.getElementById("sort-container").style.display = "none";
           document.getElementById("choices-list").style.display = "block";
           renderChoicesUI();
       }
   }
}

// 語句整序UI描画
function renderSortUI() {
    const q = currentQuestions[currentIndex];
    const pool = document.getElementById("word-pool");
    const zone = document.getElementById("answer-zone");
    pool.innerHTML = "";
    zone.innerHTML = "";

    q.words.forEach((word, idx) => {
        const chip = document.createElement("div");
        chip.className = "word-chip";
        if (selectedWords.includes(idx)) {
            chip.classList.add("selected");
        } else {
            chip.onclick = () => {
                selectedWords.push(idx);
                renderSortUI();
            };
        }
        chip.innerText = word;
        pool.appendChild(chip);
    });

    selectedWords.forEach((wordIdx, orderIndex) => {
        const chip = document.createElement("div");
        chip.className = "word-chip";
        chip.innerText = q.words[wordIdx];
        chip.onclick = () => {
            selectedWords.splice(orderIndex, 1);
            renderSortUI();
        };
        zone.appendChild(chip);
    });
}

function clearSortAnswer() {
    selectedWords = [];
    renderSortUI();
}

function checkSortAnswer() {
    if (isAnswered) return;

    const q = currentQuestions[currentIndex];
   const requiredCount = q.words.length - (q.unusedCount || 0);

if (selectedWords.length !== requiredCount) {
    if (q.unusedCount) {
        alert(`単語を ${requiredCount} 個選んで並べ替えてください。`);
    } else {
        alert("すべての単語を並べ替えてください。");
    }
    return;
} 

    isAnswered = true;
    const userAnsText = selectedWords.map(idx => q.words[idx]).join(" ");
    
    // 記号や空白をすべて除去して純粋な文字列として比較
    const normalize = (str) => str.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    
    const isCorrect = (normalize(userAnsText) === normalize(q.answer));
    const msg = document.getElementById("result-message");

    if (isCorrect) {
        score++;
        msg.innerHTML = `<span style="color:#2ecc71;">⭕ 正解！</span><br><b>完成文:</b> ${q.displayAnswer}<br><small>${q.explanation}</small>`;
    } else {
        msg.innerHTML = `<span style="color:#e74c3c;">❌ 不正解...</span><br><b>正解:</b> ${q.displayAnswer}<br><small>${q.explanation}</small>`;
    }

    document.getElementById("next-btn").style.display = "block";
}

function makeChoices(correctAnswer, allCategoryWords) {
   const specialCategories = ["不規則動詞 (過去形)", "不規則動詞 (過去分詞)", "形容詞・副詞 (比較級)", "形容詞・副詞 (最上級)"];
    
   if (specialCategories.includes(currentCategory)) {
       let finalChoices = [correctAnswer];
       const currentWord = allCategoryWords.find(w => w.english === correctAnswer);
       if (currentWord && currentWord.ing) {
           finalChoices.push(currentWord.ing);
       }
       let otherWords = allCategoryWords.filter(w => w.english !== correctAnswer);
       otherWords.sort(() => Math.random() - 0.5);
       for (let i = 0; i < otherWords.length; i++) {
           if (finalChoices.length >= 4) break;
           finalChoices.push(otherWords[i].english);
       }
       while (finalChoices.length < 4) {
           finalChoices.push("went", "made", "computer", "cheaper");
       }
       return finalChoices.sort(() => Math.random() - 0.5);
    }
    
   const allEnglish = allCategoryWords.map(w => w.english); 
   let dummies = allEnglish.filter(eng => eng !== correctAnswer); 
   dummies.sort(() => Math.random() - 0.5); 
   let chosenDummies = dummies.slice(0, 3);
   while (chosenDummies.length < 3) {
       chosenDummies.push("apple", "book", "desk", "test"); 
    }
   let finalChoices = [correctAnswer, ...chosenDummies.slice(0, 3)];
   return finalChoices.sort(() => Math.random() - 0.5);
}

function checkWordAnswer(clickedBtn, selected, correct) {
   if (isAnswered) return; 
   isAnswered = true; 
   const choiceButtons = document.querySelectorAll(".choice-btn"); 
   const resultMsg = document.getElementById("result-message");
    
   if (selected === correct) {
       clickedBtn.classList.add("correct"); 
       resultMsg.innerText = "⭕ 正解！";
       resultMsg.style.color = "#2ecc71"; 
       score++; 
    } else { 
       clickedBtn.classList.add("incorrect"); 
       resultMsg.innerText = `❌ 不正解！ 正解は: ${correct}`; 
       resultMsg.style.color = "#e74c3c";
       choiceButtons.forEach(btn => { 
           if (btn.innerText.trim() === correct) { 
               btn.classList.add("correct"); 
           } 
       }); 
    }
   document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() { 
   currentIndex++;
   if (currentIndex < currentQuestions.length) { 
       showQuestion(); 
    } else { 
       showResult(); 
    }
}

function showResult() {
   document.getElementById("quiz-screen").style.display = "none";
   document.getElementById("result-screen").style.display = "block";
   document.getElementById("final-score").innerText = `${currentQuestions.length} 問中 ${score} 問 正解！`;
}

function speakWord() {
   if (!('speechSynthesis' in window)) {
       alert('このブラウザは音声再生に対応していません。Chromeをご利用ください。');
       return;
    }
   const currentQuestion = currentQuestions[currentIndex];

let word = "";

if (isWordQuizMode) {
    word = currentQuestion.english;
} else {
    word = currentQuestion.displayAnswer;
}

word = word.replace(/～/g, '').replace(/~/g, '').trim();
    
   if (word === "read" && currentQuestion.japanese.includes("過去")) {
       word = "red";
    }
   speechSynthesis.cancel();
   const uttr = new SpeechSynthesisUtterance(word);
   uttr.lang = 'en-US';
   uttr.rate = 0.8;
   speechSynthesis.speak(uttr);
}
